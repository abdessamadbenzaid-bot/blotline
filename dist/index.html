<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src blob: data:; media-src blob:; connect-src blob:; base-uri 'none'; form-action 'none'">
<meta name="theme-color" content="#0d0d0b">
<title>Blotline</title>
<style>:root{--ink:#0d0d0b;--p1:#171613;--p2:#211f1b;--line:#322f29;--paper:#f3efe4;--mut:#a39d8e;--mark:#ffe14a;--bad:#ff6a4d;--ok:#86dc9b;--r:10px;font-family:Roboto,"Noto Sans","Noto Naskh Arabic","Segoe UI",system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--ink);color:var(--paper);overflow:hidden}
button,input{font:inherit;color:inherit}
button{background:var(--p2);border:1px solid var(--line);border-radius:var(--r);min-height:44px;padding:0 12px;font-weight:600;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px}
button:active{transform:translateY(1px)}
button:disabled{opacity:.4}
button:focus-visible,input:focus-visible,label.cta:focus-within{outline:2px solid var(--mark);outline-offset:2px}
svg.i{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.pri{background:var(--mark);border-color:var(--mark);color:#16140a;font-weight:800}
.ghost{background:transparent;border-color:transparent}
.ic{width:44px;padding:0}
.hide{display:none!important}
#home{height:100%;overflow-y:auto;display:flex;flex-direction:column;padding:max(18px,env(safe-area-inset-top)) 24px max(22px,env(safe-area-inset-bottom));max-width:620px;margin:auto}
.hbar{display:flex;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:center;gap:9px;font-weight:900;font-size:18px;letter-spacing:-.02em}
.logo i{display:block;width:26px;height:18px;border:2px solid var(--paper);border-radius:4px;position:relative;overflow:hidden}
.logo i:after{content:"";position:absolute;inset:4px -2px;background:var(--mark)}
.hero{flex:1;display:flex;flex-direction:column;justify-content:center;gap:18px}
h1{font-size:clamp(39px,12vw,62px);line-height:1.06;margin:0;font-weight:900;letter-spacing:-.035em}
[dir=rtl] h1{letter-spacing:0;line-height:1.3}
.bar{position:relative;display:inline-block;white-space:nowrap}
.bar:after{content:"";position:absolute;inset:.1em -.07em .04em;background:var(--mark);transform-origin:0 50%;animation:swipe 3.8s cubic-bezier(.7,0,.2,1) infinite}
[dir=rtl] .bar:after{transform-origin:100% 50%}
@keyframes swipe{0%,14%{transform:scaleX(0)}34%,100%{transform:scaleX(1)}}
@media (prefers-reduced-motion:reduce){.bar:after{animation:none}}
.sub{color:var(--mut);font-size:16px;line-height:1.55;margin:0;max-width:30em}
label.cta{display:flex;align-items:center;justify-content:center;gap:10px;background:var(--mark);color:#16140a;font-weight:900;font-size:17px;min-height:58px;border-radius:12px;cursor:pointer}
.proms{display:flex;flex-wrap:wrap;gap:6px 18px;color:var(--mut);font-size:13px;justify-content:center;margin:14px 0 0}
.proms span:before{content:"";display:inline-block;width:9px;height:9px;background:var(--mark);margin-inline-end:7px}
#ed{height:100%;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
.top{display:flex;align-items:center;gap:2px;padding:4px 8px;flex:none}
.top .logo{font-size:15px;margin-inline-end:auto;padding-inline-start:6px}
.top .logo b{display:none}
@media(min-width:400px){.top .logo b{display:inline}}
#stage{position:relative;flex:1 1 34%;min-height:150px;background:#050504;display:flex;align-items:center;justify-content:center;overflow:hidden}
#wrap{position:relative;line-height:0}
#pv{display:block;background:#000}
#ov{position:absolute;inset:0;touch-action:none;cursor:crosshair}
.chip{position:absolute;inset-inline:10px;bottom:10px;background:rgba(13,13,11,.94);border:1px solid var(--line);border-radius:var(--r);padding:8px 8px 8px 12px;display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600}
.chip .m{flex:1;height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.chip .m i{display:block;height:100%;background:var(--mark);width:0}
#hint{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:rgba(13,13,11,.82);padding:6px 11px;border-radius:7px;font-size:12px;color:var(--paper);pointer-events:none;white-space:nowrap;max-width:94%;overflow:hidden;text-overflow:ellipsis}
.trans{display:flex;align-items:center;gap:4px;padding:6px 8px 2px;flex:none;direction:ltr}
#tc{font:700 14px ui-monospace,"Roboto Mono",Menlo,monospace;padding:0 7px;white-space:nowrap}
#tc small{color:var(--mut);font-weight:500;font-size:12px}
#hold{margin-inline-start:auto;font-size:12px;padding:0 10px;user-select:none;-webkit-user-select:none;touch-action:none;direction:ltr}
#tlw{padding:3px 12px 6px;flex:none;direction:ltr}
#tl{display:block;width:100%;height:76px;touch-action:none;cursor:ew-resize}
.tabs{display:flex;border-block:1px solid var(--line);flex:none}
.tabs button{flex:1;background:none;border:0;border-radius:0;color:var(--mut);position:relative}
.tabs button[aria-selected=true]{color:var(--paper)}
.tabs button[aria-selected=true]:after{content:"";position:absolute;inset-inline:22%;bottom:0;height:3px;background:var(--mark)}
#panel{flex:1 1 30%;min-height:178px;overflow-y:auto;padding:12px 12px max(14px,env(safe-area-inset-bottom));overscroll-behavior:contain}
.row{display:flex;gap:7px;margin-bottom:10px}
.row>button{flex:1;min-width:0}
.row.pre button{flex-direction:column;gap:2px;min-height:56px;padding:0 2px;font-size:12px}
.lbl{font-size:12px;color:var(--mut);font-weight:600;margin:0 0 5px}
.seg{display:flex;background:var(--p1);border:1px solid var(--line);border-radius:var(--r);padding:3px;margin-bottom:10px}
.seg button{flex:1;min-width:0;border:0;background:none;min-height:38px;padding:0 4px;color:var(--mut);border-radius:7px;font-size:13px}
.seg button[aria-pressed=true]{background:var(--paper);color:#16140a;font-weight:800}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px;padding-bottom:2px}
.chips button{flex:none;min-height:36px;font-size:12px}
.chips button[aria-pressed=true]{border-color:var(--mark);color:var(--mark)}
input[type=range]{width:100%;height:38px;accent-color:var(--mark);margin:0;display:block}
.note{color:var(--mut);font-size:13px;line-height:1.5;margin:4px 0 10px}
.bl{display:flex;align-items:center;justify-content:space-between;background:var(--p1);border:1px solid var(--line);border-radius:var(--r);padding-inline-start:12px;margin-bottom:6px;font:600 13px ui-monospace,monospace;direction:ltr}
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.66);z-index:20;display:flex;align-items:flex-end;justify-content:center}
#sheet{background:var(--p1);border:1px solid var(--line);border-bottom:0;border-radius:16px 16px 0 0;width:100%;max-width:560px;max-height:92%;overflow-y:auto;padding:18px 16px max(18px,env(safe-area-inset-bottom))}
#sheet h2{font-size:21px;margin:0 0 4px;font-weight:900;letter-spacing:-.01em}
#sheet p{line-height:1.55;font-size:14px;color:var(--mut);margin:6px 0 14px}
.vd{font-weight:700;font-size:14px;margin:0 0 12px}
.vd.ok{color:var(--ok)}.vd.w{color:var(--mark)}
.it{display:flex;gap:10px;align-items:flex-start;border-top:1px solid var(--line);padding:10px 0;font-size:14px;line-height:1.45}
.it>span{flex:1}
.it svg{margin-top:1px}
.it .acts{display:flex;gap:5px;flex:none}
.it .acts button{min-height:36px;font-size:12px;padding:0 9px}
.w svg,.it.w svg{color:var(--mark)}.it.b svg{color:var(--bad)}.it.k svg{color:var(--ok)}
.foot{display:flex;gap:8px;margin-top:14px}
.foot button{flex:1;min-height:50px}
.prog{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:14px 0 8px}
.prog i{display:block;height:100%;width:0;background:var(--mark)}
.pct{font:800 34px ui-monospace,monospace;direction:ltr;text-align:start}
#sheet video{width:100%;max-height:44vh;background:#000;border-radius:var(--r);display:block;margin:10px 0}
.lg{display:grid;gap:7px}.lg button{min-height:50px;justify-content:flex-start;padding:0 16px;font-size:15px}
.lg button[aria-pressed=true]{border-color:var(--mark);color:var(--mark)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:max(18px,env(safe-area-inset-bottom));z-index:40;background:var(--paper);color:#16140a;padding:11px 15px;border-radius:9px;font-size:13px;font-weight:700;width:max-content;max-width:90vw;box-shadow:0 8px 28px #000a}
@media (min-width:920px),(orientation:landscape) and (max-height:620px){#ed{display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,38%);grid-template-rows:auto minmax(0,1fr) auto auto}.top{grid-column:1/3;grid-row:1}#stage{grid-column:1;grid-row:2;min-height:0}.trans{grid-column:1;grid-row:3}#tlw{grid-column:1;grid-row:4}.tabs{grid-column:2;grid-row:2;align-self:start;height:46px}#panel{grid-column:2;grid-row:2/5;margin-top:46px;min-height:0;border-inline-start:1px solid var(--line)}}
@media (orientation:landscape) and (max-height:620px){#tl{height:60px}.trans{padding-top:2px}h1{font-size:34px}.hero{gap:8px}.sub{font-size:14px}label.cta{min-height:48px}.proms{margin-top:8px}}
</style>
</head>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="play" viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z" fill="currentColor"/></symbol>
<symbol id="pause" viewBox="0 0 24 24"><path d="M8 5v14M16 5v14" stroke-width="3.4"/></symbol>
<symbol id="prev" viewBox="0 0 24 24"><path d="M18 5l-9 7 9 7zM5 5v14"/></symbol>
<symbol id="next" viewBox="0 0 24 24"><path d="M6 5l9 7-9 7zM19 5v14"/></symbol>

<symbol id="lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/></symbol>

<symbol id="x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
<symbol id="target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/><path d="M12 2v5M12 17v5M2 12h5M17 12h5"/></symbol>
<symbol id="ok" viewBox="0 0 24 24"><path d="M4 13l5 5L20 6"/></symbol>
<symbol id="warn" viewBox="0 0 24 24"><path d="M12 3l10 18H2zM12 10v5M12 18v.01"/></symbol>
<symbol id="face" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4.5"/><path d="M4 21c1-5 4-7 8-7s7 2 8 7"/></symbol>
<symbol id="car" viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="10" rx="2"/><path d="M7 12h3M14 12h3"/></symbol>
<symbol id="txt" viewBox="0 0 24 24"><path d="M5 6V4h14v2M12 4v16M9 20h6"/></symbol>

</defs></svg>

<main id="home">
  <div class="hbar">
    <div class="logo"><i></i>Blotline</div>
    <button class="ghost ic" data-act="lang" data-ta="lang"><svg class="i"><use href="#globe"/></svg></button>
  </div>
  <div class="hero">
    <h1><span data-t="tag1"></span><br><span data-t="tag2"></span> <span class="bar" data-t="tag3"></span></h1>
    <p class="sub" data-t="homeSub"></p>
  </div>
  <label class="cta"><svg class="i"><use href="#plus"/></svg><span data-t="open"></span><input id="file" class="hide" type="file" accept="video/*"></label>
  <div class="proms"><span data-t="p1"></span><span data-t="p2"></span><span data-t="p3"></span></div>
</main>

<div id="ed" class="hide">
  <header class="top">
    <div class="logo"><i></i><b>Blotline</b></div>
    <button class="ghost ic" data-act="undo" id="undoB" data-ta="undo"><svg class="i"><use href="#undo"/></svg></button>
    <button class="ghost ic" data-act="lang" data-ta="lang"><svg class="i"><use href="#globe"/></svg></button>
    <button class="ghost ic" data-act="about" data-ta="about"><svg class="i"><use href="#lock"/></svg></button>
    <button class="ghost ic" data-act="leave" data-ta="close"><svg class="i"><use href="#x"/></svg></button>
    <button class="pri" data-act="check" data-t="export"></button>
  </header>
  <section id="stage">
    <div id="wrap"><canvas id="pv"></canvas><canvas id="ov"></canvas></div>
    <div id="hint" data-t="drawHint"></div>
    <div id="tchip" class="chip hide"><span data-t="tracking"></span><div class="m"><i id="tbar"></i></div><button data-act="trackStop" data-t="cancel" style="min-height:36px"></button></div>
  </section>
  <div class="trans">
    <button class="pri ic" data-act="toggle" data-ta="play" id="pp"><svg class="i"><use href="#play"/></svg></button>
    <button class="ic" data-act="prev" data-ta="prev"><svg class="i"><use href="#prev"/></svg></button>
    <button class="ic" data-act="next" data-ta="next"><svg class="i"><use href="#next"/></svg></button>
    <div id="tc"></div>
    <button id="hold" data-t="hold"></button>
  </div>
  <div id="tlw"><canvas id="tl" role="slider" aria-label="Timeline" tabindex="0"></canvas></div>
  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="masks" data-t="masks"></button>
    <button role="tab" data-tab="frame" data-t="frame"></button>
    <button role="tab" data-tab="sound" data-t="sound"></button>
  </nav>
  <section id="panel"></section>
</div>

  if(typeof VideoEncoder==='undefined'){toast(T('errEnc'));return}const cfg=await pickCodec(W,H,br);if(!cfg){toast(T('errEnc'));return}
  S.busy='export';expCancel=false;openSheet(`<h2>${esc(T('rendering'))}</h2><div class="pct" id="xpct">0%</div><div class="prog"><i id="xbar"></i></div><p id="xlab">${esc(T('keepOpen'))}</p><div class="foot"><button data-act="stopExport">${esc(T('cancel'))}</button></div>`);
  let wl=null;try{wl=await navigator.wakeLock.request('screen')}catch(e){}try{window.BlotlineNative&&BlotlineNative.keepAwake(true)}catch(e){}
  try{let D=null;try{D=await demuxMp4(S.file)}catch(e){D=null}const plan={pass:false,A:null,acfg:null,notice:''};
    if(S.audio==='keep'){if(D&&D.audio&&!S.bleeps.length)plan.pass=true;else if(D&&!D.hasAudio)plan.notice=T('noAudio');else if(S.dur>1200)plan.notice=T('tooLong');else if(S.file.size>734003200)plan.notice=T('tooBig');else{setProg(0,T('audioStep'));try{plan.A=await loadPCM();plan.acfg=typeof AudioEncoder!=='undefined'?await pickAudio(plan.A.sr,plan.A.ch):null;if(!plan.acfg){plan.A=null;plan.notice=T('noAudio')}}catch(e){plan.A=null;plan.notice=T('noAudio')}}}
    setProg(0,T('keepOpen'));const fast=!!D&&await videoReady(D);let blob=null;S.expMode=fast?'decode':'seek';
    if(fast){try{blob=await renderClip(cfg,W,H,D,plan,true)}catch(e){console.warn('fast export failed',e);S.expMode='seek';if(!expCancel){setProg(0,T('keepOpen'));blob=await renderClip(cfg,W,H,D,plan,false)}}}else blob=await renderClip(cfg,W,H,D,plan,false);
    if(expCancel||!blob){endExport(wl);sheetCheck();return}
    resultBlob=blob;nativeSaved=false;endExport(wl);const d=new Date(),P=x=>String(x).padStart(2,'0');resultName=`Blotline_${d.getFullYear()}${P(d.getMonth()+1)}${P(d.getDate())}_${P(d.getHours())}${P(d.getMinutes())}${P(d.getSeconds())}.mp4`;resultURL=URL.createObjectURL(resultBlob);
    openSheet(`<h2>${esc(T('done'))}</h2>${plan.notice?`<p class="vd w">${esc(plan.notice)}</p>`:''}<video id="res" src="${resultURL}" controls playsinline></video><p>${W}×${H} · 30 fps · ${fmtT(S.b-S.a)} · ${(resultBlob.size/1048576).toFixed(1)} MB</p><div class="foot"><button class="pri" data-act="save">${esc(T('save'))}</button><button data-act="share">${esc(T('share'))}</button><button data-act="closeSheet">${esc(T('close'))}</button></div>`)
  }catch(e){console.error(e);endExport(wl);closeSheet();toast(T('errExp'))}}
function endExport(wl){S.busy=false;try{wl&&wl.release()}catch(e){}try{window.BlotlineNative&&BlotlineNative.keepAwake(false)}catch(e){}seek(clamp(S.t,S.a,S.b))}
function b64(buf){const a=new Uint8Array(buf);let s='';for(let i=0;i<a.length;i+=32768)s+=String.fromCharCode.apply(null,a.subarray(i,i+32768));return btoa(s)}
let nativeSaved=false;async function toNative(){const N=window.BlotlineNative;if(nativeSaved)return;if(!N.begin(resultName,'video/mp4'))throw new Error('begin');const size=786432;for(let p=0;p<resultBlob.size;p+=size){N.write(b64(await resultBlob.slice(p,p+size).arrayBuffer()));await sleep(0)}N.end();nativeSaved=true}
async function saveResult(){try{if(window.BlotlineNative){await toNative();toast(T('saved'));return}const a=document.createElement('a');a.href=resultURL;a.download=resultName;document.body.appendChild(a);a.click();a.remove()}catch(e){toast(T('errExp'))}}
async function shareResult(){try{if(window.BlotlineNative){await toNative();BlotlineNative.shareLast();return}const f=new File([resultBlob],resultName,{type:'video/mp4'});if(navigator.canShare&&navigator.canShare({files:[f]}))await navigator.share({files:[f]});else saveResult()}catch(e){}}

/* ---------- Android back ---------- */
window.blotlineBack=function(){if(S.busy)return true;if(!$('#scrim').classList.contains('hide')){closeSheet();return true}if(S.url){sheetLeave();return true}return false};
let saved=null;try{saved=localStorage.getItem('bc_lang')}catch(e){}const nav=(navigator.language||'en').slice(0,2);setLang(saved||(LANGS[nav]?nav:'en'));requestAnimationFrame(loop);
if(location.hash==='#qa')window.__bc={S,boxAt};
})();
</script>

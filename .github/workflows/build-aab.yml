name: Build signed AAB
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: signed-aab
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: { distribution: temurin, java-version: "17" }
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: "platforms;android-36 build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with: { gradle-version: "8.13" }
      - name: Prepare the upload key
        env:
          KEY_PASSWORD: ${{ secrets.BLOTLINE_KEY_PASSWORD }}
        run: |
          if [ "${#KEY_PASSWORD}" -lt 20 ]; then echo "::error::Add the secret BLOTLINE_KEY_PASSWORD with at least 20 characters."; exit 1; fi
          ENC=android/keystore/upload.p12.enc
          KS="$RUNNER_TEMP/upload.p12"
          if [ -f "$ENC" ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -pass env:KEY_PASSWORD -in "$ENC" -out "$KS"
          else
            keytool -genkeypair -noprompt -storetype PKCS12 -keystore "$KS" -alias blotline -keyalg RSA -keysize 4096 -validity 10000 -dname "CN=Blotline, O=Samed, C=MA" -storepass:env KEY_PASSWORD -keypass:env KEY_PASSWORD
            mkdir -p android/keystore
            openssl enc -aes-256-cbc -salt -pbkdf2 -iter 600000 -pass env:KEY_PASSWORD -in "$KS" -out "$ENC"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$ENC"
            git commit -m "Add encrypted upload key"
            git push
          fi
          keytool -list -keystore "$KS" -storetype PKCS12 -storepass:env KEY_PASSWORD -alias blotline | tail -1
      - name: Build the signed bundle
        working-directory: android
        env:
          BLOTLINE_KEYSTORE: ${{ runner.temp }}/upload.p12
          BLOTLINE_KEYSTORE_PASSWORD: ${{ secrets.BLOTLINE_KEY_PASSWORD }}
          BLOTLINE_KEY_ALIAS: blotline
          BLOTLINE_KEY_PASSWORD: ${{ secrets.BLOTLINE_KEY_PASSWORD }}
          BLOTLINE_VERSION_CODE: ${{ github.run_number }}
        run: gradle :app:bundleRelease --no-daemon --stacktrace
      - name: Check the bundle
        run: |
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          jarsigner -verify "$AAB" | tail -1
          unzip -o -q "$AAB" base/manifest/AndroidManifest.xml -d /tmp/aab
          if grep -a -E "android.permission.(INTERNET|ACCESS_NETWORK_STATE|READ_MEDIA_VIDEO|READ_EXTERNAL_STORAGE)" /tmp/aab/base/manifest/AndroidManifest.xml; then exit 1; fi
          rm -f "$RUNNER_TEMP/upload.p12"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: blotline-aab-v${{ github.run_number }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

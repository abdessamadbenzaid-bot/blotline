name: Vendor face detector
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/vendor-face.yml"
permissions:
  contents: write
jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Download MediaPipe runtime and model
        run: |
          mkdir -p web/vendor /tmp/mp && cd /tmp/mp
          npm pack @mediapipe/tasks-vision@latest --silent
          tar xzf mediapipe-tasks-vision-*.tgz
          cd "$GITHUB_WORKSPACE"
          P=/tmp/mp/package
          cat $P/package.json | grep -E '"version"|"license"'
          cp $P/vision_bundle.cjs web/vendor/vision_bundle.js
          cp $P/wasm/vision_wasm_internal.js web/vendor/vision_wasm_internal.js
          cp $P/wasm/vision_wasm_internal.wasm web/vendor/vision_wasm_internal.wasm
          cp $P/LICENSE web/vendor/LICENSE-mediapipe.txt 2>/dev/null || curl -fsSL https://raw.githubusercontent.com/google-ai-edge/mediapipe/master/LICENSE -o web/vendor/LICENSE-mediapipe.txt
          curl -fsSL https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/1/blaze_face_short_range.tflite -o web/vendor/blaze_face_short_range.tflite
          grep -m1 '"version"' $P/package.json | tr -d ' ,' > web/vendor/VERSION.txt
          ls -la web/vendor; sha256sum web/vendor/*
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/vendor
          git commit -m "Add on-device face detector runtime and model"
          git push

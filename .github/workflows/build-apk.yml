name: Build test APK
on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "!android/keystore/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: { distribution: temurin, java-version: "17" }
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: "platforms;android-36 build-tools;35.0.0"
      - uses: gradle/actions@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with: { gradle-version: "8.13" }
      - name: Build debug APK
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Confirm the app has no network or media permission
        run: |
          AAPT2="$ANDROID_HOME/build-tools/35.0.0/aapt2"
          "$AAPT2" dump permissions android/app/build/outputs/apk/debug/app-debug.apk | tee /tmp/permissions.txt
          if grep -E "android.permission.(INTERNET|ACCESS_NETWORK_STATE|READ_MEDIA_VIDEO|READ_EXTERNAL_STORAGE)" /tmp/permissions.txt; then exit 1; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: blotline-test-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  release-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: { distribution: temurin, java-version: "17" }
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: "platforms;android-36 build-tools;35.0.0"
      - uses: gradle/actions@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with: { gradle-version: "8.13" }
      - name: Build release with a temporary key
        working-directory: android
        run: |
          PASS=$(openssl rand -hex 24)
          echo "::add-mask::$PASS"
          keytool -genkeypair -noprompt -storetype PKCS12 -keystore "$RUNNER_TEMP/temp.p12" -alias temp -keyalg RSA -keysize 2048 -validity 2 -dname "CN=Temporary" -storepass "$PASS" -keypass "$PASS"
          BLOTLINE_KEYSTORE="$RUNNER_TEMP/temp.p12" BLOTLINE_KEYSTORE_PASSWORD="$PASS" BLOTLINE_KEY_ALIAS=temp BLOTLINE_KEY_PASSWORD="$PASS" gradle :app:assembleRelease :app:bundleRelease --no-daemon --stacktrace
      - name: Check the release build
        run: |
          BT="$ANDROID_HOME/build-tools/35.0.0"
          APK=android/app/build/outputs/apk/release/app-release.apk
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          "$BT/aapt2" dump badging "$APK" > /tmp/badging.txt
          grep -E "^package:|^sdkVersion|^targetSdkVersion|^uses-permission" /tmp/badging.txt
          grep -q "^targetSdkVersion:'36'" /tmp/badging.txt
          grep -q "^sdkVersion:'29'" /tmp/badging.txt
          if grep -E "android.permission.(INTERNET|ACCESS_NETWORK_STATE|READ_MEDIA_VIDEO|READ_EXTERNAL_STORAGE)" /tmp/badging.txt; then exit 1; fi
          "$BT/apksigner" verify "$APK"
          unzip -l "$APK" | grep -q "assets/index.html"
          if unzip -l "$APK" | grep -q " lib/"; then echo "Unexpected native library"; exit 1; fi
          "$BT/dexdump" -a "$APK" > /tmp/dex.txt
          for m in begin write end shareLast keepAwake; do grep -q "name *: '$m'" /tmp/dex.txt; done
          test "$(grep -c 'Landroid/webkit/JavascriptInterface;' /tmp/dex.txt)" -ge 5
          jarsigner -verify "$AAB" | tail -1
          echo "Release build checks passed"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: blotline-release-check-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 14
